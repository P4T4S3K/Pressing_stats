<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressing Stats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Pressing Stats</h1>
  <div class="clock">
    <span id="clock" class="clock-time">00:00</span>
    <button id="clockBtn" class="ctrl">Start clock</button>
  </div>
</header>

<main>
  <section class="teams">
    <div class="team team-a" data-team="A">
      <input class="team-name" id="nameA" value="Team A" aria-label="Team A name">
      <div class="counts"><span class="ok" id="countA-ok">0</span> / <span class="ko" id="countA-ko">0</span></div>
      <button class="press press-ok" data-team="A" data-result="ok">Successful</button>
      <button class="press press-ko" data-team="A" data-result="ko">Unsuccessful</button>
    </div>
    <div class="team team-b" data-team="B">
      <input class="team-name" id="nameB" value="Team B" aria-label="Team B name">
      <div class="counts"><span class="ok" id="countB-ok">0</span> / <span class="ko" id="countB-ko">0</span></div>
      <button class="press press-ok" data-team="B" data-result="ok">Successful</button>
      <button class="press press-ko" data-team="B" data-result="ko">Unsuccessful</button>
    </div>
  </section>

  <div class="toolbar">
    <button id="undoBtn" class="ctrl">Undo last</button>
    <button id="csvBtn" class="ctrl">Export CSV</button>
    <button id="resetBtn" class="ctrl danger">Reset match</button>
  </div>

  <section class="report">
    <h2>Report</h2>
    <table class="stats">
      <thead>
        <tr><th></th><th id="headA" class="th-a">Team A</th><th id="headB" class="th-b">Team B</th></tr>
      </thead>
      <tbody>
        <tr><td>Total pressing actions</td><td id="totA">0</td><td id="totB">0</td></tr>
        <tr><td>Successful</td><td id="okA">0</td><td id="okB">0</td></tr>
        <tr><td>Unsuccessful</td><td id="koA">0</td><td id="koB">0</td></tr>
        <tr><td>Success rate</td><td id="rateA">–</td><td id="rateB">–</td></tr>
        <tr><td>Share of all pressing</td><td id="shareA">–</td><td id="shareB">–</td></tr>
      </tbody>
    </table>

    <h3>Success rate</h3>
    <div class="bars">
      <div class="bar-row"><span class="bar-label" id="barLabelA">Team A</span><div class="bar"><div class="bar-ok" id="barOkA"></div><div class="bar-ko" id="barKoA"></div></div></div>
      <div class="bar-row"><span class="bar-label" id="barLabelB">Team B</span><div class="bar"><div class="bar-ok" id="barOkB"></div><div class="bar-ko" id="barKoB"></div></div></div>
      <div class="legend"><span class="sw sw-ok"></span>Successful <span class="sw sw-ko"></span>Unsuccessful</div>
    </div>

    <h3>By 15-minute period</h3>
    <table class="stats" id="periodTable">
      <thead><tr><th>Period</th><th class="th-a" id="perHeadA">Team A</th><th class="th-b" id="perHeadB">Team B</th></tr></thead>
      <tbody></tbody>
    </table>

    <h3>Event log</h3>
    <ol id="log" class="log" reversed></ol>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
